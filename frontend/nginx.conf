server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Admin can upload RTF/TXT NPA files; keep the proxy headroom above the
    # backend's ADMIN_NPA_MAX_UPLOAD_MB so the 413 comes from FastAPI with a
    # readable error body, not nginx with a generic 413.
    client_max_body_size 100m;

    # WebSocket — must come BEFORE the generic /api/ rule so it does not
    # accidentally match the regex-less prefix and lose Upgrade headers.
    location /api/ws {
        proxy_pass http://app:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/admin/ws {
        proxy_pass http://app:8000/api/admin/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"detail":"Backend is unavailable"}';
    }

    location /assets/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Admin SPA. /admin and /admin/login are virtual routes — serve admin.html
    # and let the JS pick the right screen by window.location.pathname.
    location /admin {
        add_header Cache-Control "no-store";
        try_files $uri /admin.html;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
